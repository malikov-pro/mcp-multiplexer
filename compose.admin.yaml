name: mcp-multiplexer-admin

services:
  mcp-multiplexer-admin:
    build:
      context: .
    image: local/mcp-multiplexer:0.1.0
    container_name: mcp-multiplexer-admin
    restart: unless-stopped
    environment:
      MCP_CONFIG: /config/config.admin.json
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8010"
      LOG_LEVEL: info
    volumes:
      - ./config:/config:ro
    networks:
      - mcpnet
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mcpnet:
    external: true
