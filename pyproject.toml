[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-multiplexer"
version = "0.1.0"
description = "Strict MCP multiplexer: one tool surface over many equivalent MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Malikov" }]
keywords = ["mcp", "multiplexer", "mcp-hub", "1c"]
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
]

[project.scripts]
mcp-multiplexer = "mcp_multiplexer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
